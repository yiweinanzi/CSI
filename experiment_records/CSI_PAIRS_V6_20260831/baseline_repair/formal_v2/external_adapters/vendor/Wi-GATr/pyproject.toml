[project]
name = "WiGATr"
version = "1.0.0"
description = "Implementation of the Wi-GATr model and experiments."
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "black~=23.12.0",
    "clifford==1.4.0",
    "e3nn>=0.4.1",
    "einops==0.8.0",
    "gatr",
    "hydra-core==1.3.2",
    "isort~=5.13.2",
    "matplotlib==3.9.2",
    "numpy==1.24.4",
    "opt-einsum",
    "pandas==1.5.1",
    "pylint==3.0.3",
    "pytest~=7.4.3",
    "scipy==1.13.1",
    "seaborn==0.13.2",
    "torch==2.0.1",
    "torch-ema==0.3",
    "torch-geometric==2.6.0",
    "tqdm==4.66.5",
    "wiinsim",
    "xformers==0.0.20",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.isort]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
profile = "black"
line_length = 100

[tool.pylint]
generated-members = ["torch.*"]

[tool.uv]
package = true

[tool.uv.sources]
opt-einsum = { git = "https://github.com/dgasmith/opt_einsum.git", rev = "1a984b7b75f3e532e7129f6aa13f7ddc3da66e10" }
gatr = { git = "https://github.com/Qualcomm-AI-research/geometric-algebra-transformer", rev = "965a157d139de1131354a3bcc3a1e5c0d58590c1" }
wiinsim = { git = "https://github.com/Qualcomm-AI-research/WiInSim.git", rev = "86e7199fc68879490380830d95c8a0a46035e790" }
